# Weekly update pull requests; CI (tests, build, browser tests) checks each one.
# Security updates also need "Dependabot security updates" switched on under
# Settings → Code security.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      # Small updates together in one pull request.
      minor-and-patch:
        update-types: [minor, patch]
    # Major versions (TypeScript 7, ESLint 10, Vitest 5, ...) bring breaking
    # changes and need manual work; @types/node follows the Node version on
    # Vercel.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
